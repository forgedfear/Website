<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Forged Fear VR — an immersive psychological horror experience inspired by the Backrooms and Dreamcore.">
<title>FORGED FEAR // VR HORROR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050505;
    --bg2:#090909;
    --text:#e8e8e8;
    --muted:#777;
    --dim:#3c3c3c;
    --line:rgba(255,255,255,.09);
    --line2:rgba(255,255,255,.16);
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:"Courier New",monospace;
    min-height:100vh;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    opacity:.035;
    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            #fff 3px
        );
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9998;
    background:
        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.72) 100%
        );
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

::selection{
    background:#fff;
    color:#000;
}

/* =========================
   NAVIGATION
========================= */

.nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:76px;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5vw;
    border-bottom:1px solid var(--line);
    background:rgba(5,5,5,.84);
    backdrop-filter:blur(14px);
}

.logo{
    font-size:13px;
    font-weight:bold;
    letter-spacing:5px;
}

.logo span{
    color:#555;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav-links a{
    color:#777;
    font-size:9px;
    letter-spacing:2px;
    transition:.2s;
}

.nav-links a:hover{
    color:#fff;
}

.menu{
    display:none;
    border:1px solid var(--line2);
    background:transparent;
    color:#fff;
    padding:9px 12px;
    font-size:9px;
}

/* =========================
   GLOBAL
========================= */

.page{
    min-height:100vh;
    padding:140px 7vw 90px;
    position:relative;
}

.page-header{
    max-width:1100px;
    margin:0 auto 70px;
}

.number{
    color:#555;
    font-size:9px;
    letter-spacing:4px;
    margin-bottom:25px;
}

.page-title{
    font-size:clamp(50px,9vw,130px);
    line-height:.82;
    letter-spacing:-6px;
    text-transform:uppercase;
}

.outline{
    color:transparent;
    -webkit-text-stroke:1px #777;
}

.page-subtitle{
    max-width:650px;
    color:#777;
    font-size:12px;
    line-height:1.9;
    margin-top:35px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    padding:130px 7vw 80px;
}

.hero-grid{
    position:absolute;
    inset:0;
    opacity:.18;
    background-image:
        linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:70px 70px;
    transform:perspective(700px) rotateX(62deg) scale(1.6);
    transform-origin:center bottom;
    top:40%;
}

.hero-content{
    position:relative;
    z-index:3;
    max-width:1100px;
}

.kicker{
    color:#555;
    font-size:10px;
    letter-spacing:5px;
    margin-bottom:28px;
}

.hero-title{
    font-size:clamp(60px,12vw,175px);
    line-height:.76;
    letter-spacing:-10px;
    text-transform:uppercase;
}

.hero-title .solid{
    display:block;
}

.hero-title .ghost{
    display:block;
    color:transparent;
    -webkit-text-stroke:1px #666;
}

.hero-description{
    max-width:650px;
    margin-top:40px;
    color:#777;
    font-size:13px;
    line-height:2;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:35px;
}

.button{
    border:1px solid var(--line2);
    background:rgba(255,255,255,.025);
    color:#aaa;
    padding:14px 20px;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:.2s;
}

.button:hover{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.button.primary{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.button.primary:hover{
    background:#ccc;
}

.hero-status{
    position:absolute;
    right:6vw;
    bottom:60px;
    z-index:3;
    color:#444;
    font-size:8px;
    letter-spacing:3px;
    writing-mode:vertical-rl;
}

/* =========================
   SECTIONS
========================= */

.section{
    max-width:1100px;
    margin:0 auto;
}

.section-label{
    color:#555;
    font-size:9px;
    letter-spacing:4px;
    margin-bottom:25px;
}

.section-title{
    font-size:clamp(35px,6vw,80px);
    line-height:.9;
    text-transform:uppercase;
    letter-spacing:-4px;
    margin-bottom:35px;
}

.section-text{
    color:#777;
    max-width:760px;
    font-size:12px;
    line-height:2;
}

/* =========================
   LEVELS
========================= */

.levels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:55px;
}

.level{
    min-height:230px;
    border:1px solid var(--line);
    padding:25px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            transparent
        );
    transition:.25s;
}

.level:hover{
    border-color:var(--line2);
    transform:translateY(-3px);
}

.level-number{
    color:#444;
    font-size:9px;
    letter-spacing:3px;
}

.level h3{
    position:absolute;
    left:25px;
    bottom:45px;
    font-size:19px;
    font-weight:normal;
    text-transform:uppercase;
}

.level p{
    position:absolute;
    left:25px;
    bottom:20px;
    color:#555;
    font-size:8px;
    letter-spacing:1px;
}

/* =========================
   FEATURES
========================= */

.features{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:1px;
    margin-top:55px;
    background:var(--line);
    border:1px solid var(--line);
}

.feature{
    background:var(--bg);
    padding:35px;
    min-height:180px;
}

.feature-number{
    color:#444;
    font-size:9px;
    letter-spacing:3px;
    margin-bottom:30px;
}

.feature h3{
    font-size:18px;
    font-weight:normal;
    text-transform:uppercase;
    margin-bottom:15px;
}

.feature p{
    color:#666;
    font-size:10px;
    line-height:1.8;
}

/* =========================
   QUOTE
========================= */

.quote{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:100px 0;
    margin-top:120px;
}

.quote-text{
    max-width:1000px;
    font-size:clamp(30px,6vw,75px);
    line-height:1;
    letter-spacing:-3px;
    text-transform:uppercase;
}

.quote-text span{
    color:transparent;
    -webkit-text-stroke:1px #666;
}

/* =========================
   SOCIAL
========================= */

.social{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:40px;
}

.social a{
    border:1px solid var(--line);
    padding:14px 18px;
    color:#777;
    font-size:9px;
    letter-spacing:2px;
    transition:.2s;
}

.social a:hover{
    color:#fff;
    border-color:var(--line2);
}

/* =========================
   FORM
========================= */

.form-container{
    max-width:850px;
    margin:0 auto;
}

.notice{
    border:1px solid var(--line);
    background:rgba(255,255,255,.018);
    padding:25px;
    color:#666;
    font-size:10px;
    line-height:1.9;
    margin-bottom:20px;
}

.notice strong{
    color:#aaa;
    letter-spacing:2px;
}

.form-box{
    border:1px solid var(--line);
    padding:35px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    color:#555;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:10px;
    text-transform:uppercase;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid var(--line);
    background:#080808;
    color:#eee;
    padding:15px;
    outline:none;
    font-size:11px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#555;
}

.form-group textarea{
    min-height:130px;
}

.form-note{
    color:#444;
    font-size:9px;
    line-height:1.7;
    margin-bottom:20px;
}

.success{
    display:none;
    margin-top:20px;
    border:1px solid var(--line2);
    padding:25px;
    color:#aaa;
    font-size:10px;
    line-height:1.8;
}

.success strong{
    color:#fff;
}

.dev-error{
    color:#888;
    margin-top:15px;
    font-size:10px;
}

/* =========================
   DEV SECTION
========================= */

.dev-login{
    max-width:500px;
    margin:0 auto;
}

.dev-login-box{
    border:1px solid var(--line);
    background:rgba(255,255,255,.02);
    padding:40px;
}

.dev-warning{
    border:1px solid var(--line);
    padding:20px;
    margin-bottom:20px;
    color:#666;
    font-size:10px;
    line-height:1.8;
    letter-spacing:1px;
}

.dev-dashboard{
    max-width:1200px;
    margin:0 auto;
}

.dev-topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.dev-topbar h2{
    font-size:28px;
    font-weight:normal;
    letter-spacing:-1px;
}

.dev-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:25px;
}

.dev-stat{
    border:1px solid var(--line);
    background:rgba(255,255,255,.018);
    padding:25px;
}

.dev-stat span{
    display:block;
    color:#444;
    font-size:8px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.dev-stat strong{
    font-size:30px;
    font-weight:normal;
}

.dev-search{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.dev-search input{
    flex:1;
    background:#080808;
    border:1px solid var(--line);
    color:#fff;
    padding:14px;
    outline:none;
    font-size:10px;
}

.small-button{
    border:1px solid var(--line2);
    background:rgba(255,255,255,.02);
    color:#888;
    padding:11px 14px;
    cursor:pointer;
    font-family:inherit;
    font-size:8px;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:.2s;
}

.small-button:hover{
    background:#fff;
    color:#000;
}

.requests{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.request-card{
    border:1px solid var(--line);
    background:rgba(255,255,255,.018);
    padding:25px;
}

.request-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.request-id{
    color:#444;
    font-size:8px;
    letter-spacing:3px;
}

.status{
    padding:7px 10px;
    border:1px solid var(--line2);
    font-size:8px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.status.pending{
    color:#aaa;
}

.status.completed{
    color:#fff;
    border-color:#777;
}

.status.rejected{
    color:#555;
}

.request-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.request-field{
    padding:15px;
    background:rgba(255,255,255,.02);
}

.request-field span{
    display:block;
    color:#444;
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:7px;
}

.request-field strong{
    font-size:11px;
    font-weight:normal;
    word-break:break-word;
}

.request-extra{
    margin-top:10px;
    padding:15px;
    background:rgba(255,255,255,.02);
    color:#666;
    font-size:10px;
    line-height:1.7;
    word-break:break-word;
}

.request-extra strong{
    color:#888;
    font-size:8px;
    letter-spacing:2px;
}

.request-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:20px;
}

.empty-requests{
    padding:50px;
    text-align:center;
    border:1px solid var(--line);
    color:#444;
    font-size:9px;
    letter-spacing:3px;
}

/* =========================
   FOOTER
========================= */

footer{
    border-top:1px solid var(--line);
    padding:45px 7vw;
    display:flex;
    justify-content:space-between;
    gap:30px;
    flex-wrap:wrap;
    color:#444;
    font-size:8px;
    letter-spacing:2px;
}

.footer-links{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.footer-links a:hover{
    color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .nav{
        height:65px;
    }

    .nav-links{
        display:none;
        position:absolute;
        top:65px;
        left:0;
        width:100%;
        flex-direction:column;
        align-items:flex-start;
        gap:0;
        background:#050505;
        border-bottom:1px solid var(--line);
    }

    .nav-links.open{
        display:flex;
    }

    .nav-links a{
        width:100%;
        padding:18px 7vw;
        border-bottom:1px solid var(--line);
    }

    .menu{
        display:block;
    }

    .hero{
        padding-top:110px;
    }

    .hero-title{
        letter-spacing:-6px;
    }

    .hero-status{
        display:none;
    }

    .levels{
        grid-template-columns:1fr;
    }

    .features{
        grid-template-columns:1fr;
    }

    .page{
        padding-left:6vw;
        padding-right:6vw;
    }

    .page-title{
        letter-spacing:-4px;
    }

    .quote{
        margin-top:80px;
        padding:70px 0;
    }

    .dev-stats{
        grid-template-columns:1fr;
    }

    .request-info{
        grid-template-columns:1fr;
    }

    .dev-search{
        flex-direction:column;
    }

    .form-box{
        padding:25px;
    }
}

@media(max-width:480px){

    .hero-title{
        font-size:58px;
    }

    .page-title{
        font-size:55px;
    }

    .hero-description{
        font-size:11px;
    }

    footer{
        flex-direction:column;
    }
}
</style>
</head>

/* =========================
   ROUTING
========================= */

function getRoute(){

    let hash =
        window.location.hash
            .replace("#","")
            .toLowerCase();

    if(hash === "privacypolicy"){
        return "privacy";
    }

    if(hash === "data-deletion"){
        return "deletion";
    }

    if(hash === "devsection"){
        return "dev";
    }

    if(hash === "levels"){
        return "home";
    }

    if(hash === "features"){
        return "home";
    }

    return "home";
}


/* =========================
   RENDER
========================= */

function render(){

    const app =
        document.getElementById("app");

    const route =
        getRoute();


    if(route === "privacy"){

        app.innerHTML =
            privacyPage();

    }

    else if(route === "deletion"){

        app.innerHTML =
            deletionPage();

    }

    else if(route === "dev"){

        app.innerHTML =
            devPage();

    }

    else{

        app.innerHTML =
            homePage();

    }


    window.scrollTo(0,0);

    setupPage();


    if(route === "dev"){

        renderDevContent();

    }

}

function setupMenu(){

    const button =
        document.getElementById(
            "menuButton"
        );

    const links =
        document.getElementById(
            "navLinks"
        );

    if(!button || !links){
        return;
    }

    button.addEventListener(
        "click",
        function(){

            links.classList.toggle(
                "open"
            );

        }
    );


    links
        .querySelectorAll("a")
        .forEach(
            link => {

                link.addEventListener(
                    "click",
                    function(){

                        links.classList.remove(
                            "open"
                        );

                    }
                );

            }
        );

}


/* =========================
   PAGE SETUP
========================= */

function setupPage(){

    setupMenu();


    const deletionForm =
        document.getElementById(
            "deletionForm"
        );


    if(deletionForm){

        deletionForm.addEventListener(
            "submit",
            async function(e){

                e.preventDefault();


                const submit =
                    document.getElementById(
                        "deletionSubmit"
                    );

                const errorBox =
                    document.getElementById(
                        "deletionError"
                    );

                const success =
                    document.getElementById(
                        "successMessage"
                    );


                const playfab =
                    document.getElementById(
                        "playfab"
                    ).value.trim();

                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();

                const additionalInfo =
                    document.getElementById(
                        "reason"
                    ).value.trim();


                if(!playfab || !username){

                    errorBox.textContent =
                        "PlayFab ID and username are required.";

                    return;

                }


                submit.disabled =
                    true;

                submit.textContent =
                    "SUBMITTING...";

                errorBox.textContent =
                    "";


                try{

                    const response =
                        await fetch(
                            `${API_URL}/api/deletion-request`,
                            {
                                method:"POST",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:JSON.stringify({

                                    playfab_id:
                                        playfab,

                                    username:
                                        username,

                                    additional_info:
                                        additionalInfo

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if(!response.ok){

                        throw new Error(
                            data.error ||
                            "Request could not be submitted."
                        );

                    }


                    success.style.display =
                        "block";

                    document.getElementById(
                        "requestId"
                    ).textContent =
                        "#" + data.request_id;


                    deletionForm.reset();

                    submit.style.display =
                        "none";


                }
                catch(error){

                    errorBox.textContent =
                        error.message ||
                        "Could not connect to the Forged Fear server.";

                    submit.disabled =
                        false;

                    submit.textContent =
                        "SUBMIT DELETION REQUEST";

                }

            }
        );

    }

}

/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

    const token =
        localStorage.getItem(
            "forgedFearDevToken"
        );


    if(!token){

        renderDevContent();

        return;

    }


    const container =
        document.getElementById(
            "requestsContainer"
        );


    if(!container){
        return;
    }


    container.innerHTML = `
        <div class="empty-requests">
            LOADING...
        </div>
    `;


    const search =
        document.getElementById(
            "requestSearch"
        )?.value.trim() || "";


    try{

        let url =
            `${API_URL}/api/dev/deletion-requests`;


        if(search){

            url +=
                "?search=" +
                encodeURIComponent(search);

        }


        const response =
            await fetch(
                url,
                {
                    headers:{
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if(response.status === 401){

            localStorage.removeItem(
                "forgedFearDevToken"
            );

            renderDevContent();

            return;

        }


        const data =
            await response.json();


        if(!response.ok){

            container.innerHTML = `
                <div class="empty-requests">
                    FAILED TO LOAD REQUESTS
                </div>
            `;

            return;

        }


        updateStats(
            data.requests
        );


        renderRequests(
            data.requests
        );


    }
    catch(error){

        container.innerHTML = `
            <div class="empty-requests">
                SERVER CONNECTION FAILED
            </div>
        `;

    }

}


/* =========================
   STATS
========================= */

function updateStats(requests){

    const pending =
        requests.filter(
            request =>
                request.status === "pending"
        ).length;


    const completed =
        requests.filter(
            request =>
                request.status === "completed"
        ).length;


    const total =
        requests.length;


    const pendingElement =
        document.getElementById(
            "pendingCount"
        );


    const completedElement =
        document.getElementById(
            "completedCount"
        );


    const totalElement =
        document.getElementById(
            "totalCount"
        );


    if(pendingElement){
        pendingElement.textContent =
            pending;
    }


    if(completedElement){
        completedElement.textContent =
            completed;
    }


    if(totalElement){
        totalElement.textContent =
            total;
    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   RENDER REQUESTS
========================= */

function renderRequests(requests){

    const container =
        document.getElementById(
            "requestsContainer"
        );


    if(!container){
        return;
    }


    if(!requests.length){

        container.innerHTML = `

            <div class="empty-requests">
                NO DELETION REQUESTS FOUND
            </div>

        `;

        return;

    }


    container.innerHTML =
        requests.map(
            request => {

                const date =
                    request.created_at
                    ? new Date(
                        request.created_at
                    ).toLocaleString()
                    : "UNKNOWN";


                return `

                <div class="request-card">

                    <div class="request-header">

                        <div class="request-id">

                            REQUEST #${escapeHtml(
                                request.id
                            )}

                        </div>


                        <div class="status ${escapeHtml(
                            request.status
                        )}">

                            ${escapeHtml(
                                request.status
                            )}

                        </div>

                    </div>


                    <div class="request-info">

                        <div class="request-field">

                            <span>
                                PLAYFAB ID
                            </span>

                            <strong>
                                ${escapeHtml(
                                    request.playfab_id
                                )}
                            </strong>

                        </div>


                        <div class="request-field">

                            <span>
                                USERNAME
                            </span>

                            <strong>
                                ${escapeHtml(
                                    request.username
                                )}
                            </strong>

                        </div>


                        <div class="request-field">

                            <span>
                                SUBMITTED
                            </span>

                            <strong>
                                ${escapeHtml(
                                    date
                                )}
                            </strong>

                        </div>


                        <div class="request-field">

                            <span>
                                STATUS
                            </span>

                            <strong>
                                ${escapeHtml(
                                    request.status
                                ).toUpperCase()}
                            </strong>

                        </div>

                    </div>


                    ${
                        request.additional_info
                        ?
                        `

                        <div class="request-extra">

                            <strong>
                                ADDITIONAL INFORMATION
                            </strong>

                            <br><br>

                            ${escapeHtml(
                                request.additional_info
                            )}

                        </div>

                        `
                        :
                        ""
                    }


                    <div class="request-actions">

                        ${
                            request.status !== "pending"
                            ?
                            `

                            <button
                                class="small-button"
                                onclick="updateRequest(
                                    ${request.id},
                                    'pending'
                                )">

                                PENDING

                            </button>

                            `
                            :
                            ""
                        }


                        ${
                            request.status !== "completed"
                            ?
                            `

                            <button
                                class="small-button"
                                onclick="updateRequest(
                                    ${request.id},
                                    'completed'
                                )">

                                COMPLETED

                            </button>

                            `
                            :
                            ""
                        }


                        ${
                            request.status !== "rejected"
                            ?
                            `

                            <button
                                class="small-button"
                                onclick="updateRequest(
                                    ${request.id},
                                    'rejected'
                                )">

                                REJECT

                            </button>

                            `
                            :
                            ""
                        }


                        <button
                            class="small-button"
                            onclick="deleteRequest(
                                ${request.id}
                            )">

                            DELETE REQUEST

                        </button>

                    </div>

                </div>

                `;

            }
        ).join("");

}


/* =========================
   UPDATE REQUEST
========================= */

async function updateRequest(
    requestId,
    status
){

    const token =
        localStorage.getItem(
            "forgedFearDevToken"
        );


    try{

        const response =
            await fetch(
                `${API_URL}/api/dev/deletion-requests/${requestId}`,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body:JSON.stringify({
                        status:status
                    })
                }
            );


        if(response.status === 401){

            localStorage.removeItem(
                "forgedFearDevToken"
            );

            renderDevContent();

            return;

        }


        await loadRequests();

    }
    catch(error){

        alert(
            "Could not update the request."
        );

    }

}


/* =========================
   DELETE REQUEST
========================= */

async function deleteRequest(
    requestId
){

    if(
        !confirm(
            "Delete this request record?"
        )
    ){

        return;

    }


    const token =
        localStorage.getItem(
            "forgedFearDevToken"
        );


    try{

        const response =
            await fetch(
                `${API_URL}/api/dev/deletion-requests/${requestId}`,
                {
                    method:"DELETE",

                    headers:{
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if(response.status === 401){

            localStorage.removeItem(
                "forgedFearDevToken"
            );

            renderDevContent();

            return;

        }


        await loadRequests();

    }
    catch(error){

        alert(
            "Could not delete the request."
        );

    }

}

   LOGOUT
========================= */
