<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Forged Fear VR - A first-person VR horror experience inspired by the Backrooms and Dreamcore.">
<title>FORGED FEAR VR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;
    opacity:.035;
    background-image:
        linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
    background-size:80px 80px;
    mask-image:linear-gradient(to bottom,#000,transparent 85%);
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:99;
    background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,.75));
}

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    opacity:.25;
    border-radius:50%;
    animation:float linear infinite;
}

@keyframes float{
    from{transform:translateY(110vh)}
    to{transform:translateY(-10vh)}
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:76px;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(5,5,5,.72);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:14px;
    font-weight:900;
    letter-spacing:4px;
    color:#fff;
    text-decoration:none;
}

.logo-icon{
    width:28px;
    height:28px;
    border:1px solid #fff;
    position:relative;
    transform:rotate(45deg);
}

.logo-icon:after{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid #777;
}

nav ul{
    display:flex;
    gap:32px;
    list-style:none;
}

nav a{
    color:#777;
    text-decoration:none;
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    transition:.3s;
}

nav a:hover{
    color:#fff;
}

.nav-button{
    border:1px solid rgba(255,255,255,.2);
    padding:11px 18px;
    color:#fff!important;
}

.hero{
    min-height:100vh;
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    padding:130px 8% 80px;
    overflow:hidden;
    background:
        radial-gradient(circle at 75% 45%,rgba(180,180,180,.07),transparent 25%),
        radial-gradient(circle at 20% 80%,rgba(255,255,255,.025),transparent 30%);
}

.hero-lines{
    position:absolute;
    right:9%;
    top:25%;
    width:280px;
    height:420px;
    border:1px solid rgba(255,255,255,.08);
    transform:perspective(600px) rotateY(-25deg);
}

.hero-lines:before,
.hero-lines:after{
    content:"";
    position:absolute;
    inset:25px;
    border:1px solid rgba(255,255,255,.06);
}

.hero-lines:after{
    inset:55px;
}

.hero-content{
    max-width:900px;
    position:relative;
    z-index:2;
}

.kicker{
    display:flex;
    align-items:center;
    gap:12px;
    color:#aaa;
    font-size:9px;
    letter-spacing:5px;
    font-weight:800;
    margin-bottom:25px;
}

.kicker:before{
    content:"";
    width:40px;
    height:1px;
    background:#aaa;
}

h1{
    font-size:clamp(65px,11vw,155px);
    line-height:.8;
    letter-spacing:-8px;
    font-weight:950;
    text-transform:uppercase;
}

h1 .outline{
    color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.5);
}

.hero-text{
    max-width:620px;
    margin-top:38px;
    color:#929292;
    font-size:14px;
    line-height:1.9;
}

.hero-text strong{
    color:#ddd;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:32px;
}

.button{
    display:inline-block;
    padding:16px 24px;
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    text-decoration:none;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:.3s;
    background:rgba(255,255,255,.025);
}

.button:hover{
    background:#fff;
    color:#000;
    transform:translateY(-3px);
}

.button.primary{
    background:#eee;
    color:#050505;
}

.hero-meta{
    position:absolute;
    bottom:35px;
    left:8%;
    right:8%;
    display:flex;
    justify-content:space-between;
    color:#4d4d4d;
    font-size:8px;
    letter-spacing:3px;
}

.section{
    position:relative;
    z-index:2;
    padding:130px 8%;
}

.section-top{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
    margin-bottom:55px;
}

.number{
    font-size:9px;
    letter-spacing:4px;
    color:#666;
    margin-bottom:12px;
}

h2{
    font-size:clamp(42px,6vw,78px);
    line-height:.9;
    letter-spacing:-4px;
    text-transform:uppercase;
}

.section-top p{
    max-width:420px;
    color:#737373;
    font-size:13px;
    line-height:1.9;
}

.story{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.story-box{
    min-height:440px;
    padding:45px;
    border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    position:relative;
    overflow:hidden;
}

.story-box h3{
    font-size:31px;
    text-transform:uppercase;
    margin-bottom:22px;
}

.story-box p{
    color:#777;
    line-height:1.9;
    font-size:13px;
    max-width:550px;
}

.story-decoration{
    position:absolute;
    right:-60px;
    bottom:-100px;
    width:330px;
    height:330px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
}

.story-decoration:before,
.story-decoration:after{
    content:"";
    position:absolute;
    border:1px solid rgba(255,255,255,.05);
    border-radius:50%;
}

.story-decoration:before{
    inset:35px;
}

.story-decoration:after{
    inset:75px;
}

.levels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.level{
    height:210px;
    padding:25px;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(145deg,#101010,#070707);
    position:relative;
    overflow:hidden;
    transition:.35s;
}

.level:hover{
    transform:translateY(-7px);
    border-color:rgba(255,255,255,.22);
}

.level-number{
    color:#555;
    font-size:9px;
    letter-spacing:3px;
}

.level h3{
    position:absolute;
    left:25px;
    bottom:25px;
    font-size:18px;
    text-transform:uppercase;
}

.level:after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-35px;
    top:-35px;
    border:1px solid rgba(255,255,255,.05);
    transform:rotate(45deg);
}

.features{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.feature{
    min-height:230px;
    border:1px solid rgba(255,255,255,.07);
    padding:35px;
    background:rgba(255,255,255,.018);
    transition:.3s;
}

.feature:hover{
    background:rgba(255,255,255,.04);
    transform:translateY(-5px);
}

.feature-icon{
    font-size:25px;
    color:#aaa;
    margin-bottom:45px;
}

.feature h3{
    font-size:18px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.feature p{
    color:#707070;
    font-size:12px;
    line-height:1.8;
}

.quote{
    position:relative;
    z-index:2;
    padding:150px 8%;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.05);
    border-bottom:1px solid rgba(255,255,255,.05);
}

.quote-symbol{
    font-size:70px;
    color:#555;
}

.quote h2{
    max-width:1000px;
    margin:20px auto 30px;
}

.quote p{
    color:#555;
    font-size:9px;
    letter-spacing:4px;
}

.social{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.social-card{
    padding:35px;
    min-height:170px;
    border:1px solid rgba(255,255,255,.07);
    text-decoration:none;
    color:#fff;
    background:rgba(255,255,255,.018);
    transition:.3s;
}

.social-card:hover{
    transform:translateY(-5px);
    background:#fff;
    color:#000;
}

.social-card span{
    display:block;
    color:#666;
    font-size:9px;
    letter-spacing:3px;
    margin-bottom:45px;
}

.social-card h3{
    font-size:22px;
    text-transform:uppercase;
}

.cta{
    position:relative;
    z-index:2;
    margin:0 8% 100px;
    padding:90px 8%;
    border:1px solid rgba(255,255,255,.12);
    overflow:hidden;
    background:
        radial-gradient(circle at 80% 50%,rgba(255,255,255,.08),transparent 30%),
        linear-gradient(120deg,#101010,#060606);
}

.cta:before{
    content:"11";
    position:absolute;
    right:5%;
    top:-50px;
    font-size:300px;
    font-weight:950;
    color:rgba(255,255,255,.025);
}

.cta h2{
    max-width:700px;
    position:relative;
}

.cta p{
    color:#777;
    max-width:500px;
    line-height:1.9;
    margin-top:20px;
    font-size:13px;
    position:relative;
}

footer{
    position:relative;
    z-index:2;
    border-top:1px solid rgba(255,255,255,.06);
    padding:35px 8%;
    display:flex;
    justify-content:space-between;
    gap:20px;
    color:#444;
    font-size:8px;
    letter-spacing:3px;
    text-transform:uppercase;
}

footer a{
    color:#555;
    text-decoration:none;
}

footer a:hover{
    color:#fff;
}


/* =========================
   INNER PAGES
========================= */

.page{
    min-height:100vh;
    position:relative;
    z-index:2;
    padding:160px 8% 100px;
}

.page-header{
    max-width:850px;
    margin-bottom:70px;
}

.page-title{
    font-size:clamp(48px,8vw,100px);
    line-height:.85;
    letter-spacing:-5px;
    text-transform:uppercase;
}

.page-subtitle{
    color:#707070;
    margin-top:25px;
    max-width:650px;
    font-size:13px;
    line-height:1.9;
}

.policy{
    max-width:950px;
}

.policy-section{
    border-top:1px solid rgba(255,255,255,.08);
    padding:35px 0;
}

.policy-section h3{
    font-size:18px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.policy-section p,
.policy-section li{
    color:#777;
    font-size:13px;
    line-height:1.9;
}

.policy-section ul{
    padding-left:20px;
    margin-top:12px;
}

.policy-section a{
    color:#ccc;
}

.notice{
    padding:25px;
    margin-bottom:30px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.025);
    color:#888;
    font-size:12px;
    line-height:1.8;
}

.form-container{
    max-width:700px;
}

.form-box{
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.02);
    padding:40px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    color:#aaa;
    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:9px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    background:#080808;
    border:1px solid rgba(255,255,255,.12);
    color:#eee;
    padding:15px;
    font-family:inherit;
    outline:none;
    transition:.3s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:rgba(255,255,255,.4);
}

.form-group textarea{
    min-height:140px;
    resize:vertical;
}

.form-note{
    color:#555;
    font-size:10px;
    line-height:1.7;
    margin-bottom:25px;
}

.success{
    display:none;
    padding:25px;
    margin-top:20px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.025);
    color:#aaa;
    font-size:12px;
    line-height:1.8;
}

.error{
    color:#999;
    font-size:11px;
    margin-top:10px;
    display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    nav ul{
        display:none;
    }

    nav{
        padding:0 6%;
    }

    .hero{
        padding:130px 7% 90px;
    }

    h1{
        font-size:19vw;
        letter-spacing:-5px;
    }

    .hero-lines{
        opacity:.25;
        right:-100px;
    }

    .section{
        padding:100px 7%;
    }

    .section-top{
        display:block;
    }

    .section-top p{
        margin-top:20px;
    }

    .story{
        grid-template-columns:1fr;
    }

    .levels{
        grid-template-columns:1fr 1fr;
    }

    .features{
        grid-template-columns:1fr;
    }

    .social{
        grid-template-columns:1fr;
    }

    .cta{
        margin-left:5%;
        margin-right:5%;
    }

    footer{
        flex-direction:column;
        text-align:center;
    }

    .page{
        padding:130px 7% 80px;
    }
}

@media(max-width:520px){

    .levels{
        grid-template-columns:1fr;
    }

    .hero-meta{
        display:none;
    }

    .cta{
        padding:60px 30px;
    }

    .form-box{
        padding:25px;
    }
}
</style>

/* =========================
   PARTICLES
========================= */

const particles=document.getElementById("particles");

for(let i=0;i<70;i++){

    const p=document.createElement("div");

    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(8+Math.random()*18)+"s";
    p.style.animationDelay=(-Math.random()*20)+"s";
    p.style.opacity=.1+Math.random()*.3;

    particles.appendChild(p);
}

/* =========================
   ROUTER
========================= */

function getRoute(){

    let hash=window.location.hash
        .replace("#","")
        .toLowerCase();

    if(hash==="privacypolicy"){
        return "privacy";
    }

    if(hash==="data-deletion"){
        return "deletion";
    }

    return "home";
}


function render(){

    const app=document.getElementById("app");

    const route=getRoute();

    if(route==="privacy"){
        app.innerHTML=privacyPage();
    }

    else if(route==="deletion"){
        app.innerHTML=deletionPage();
    }

    else{
        app.innerHTML=homePage();
    }

    window.scrollTo(0,0);

    setupPage();

}


function setupPage(){

    document.querySelectorAll(".hero-lines").forEach(lines=>{

        document.addEventListener("mousemove",e=>{

            const x=(e.clientX/window.innerWidth-.5)*8;
            const y=(e.clientY/window.innerHeight-.5)*8;

            lines.style.transform=
                `perspective(600px) rotateY(${-25+x}deg) translate(${x}px,${y}px)`;

        });

    });


    const deletionForm=document.getElementById("deletionForm");

    if(deletionForm){

        deletionForm.addEventListener("submit",function(e){

            e.preventDefault();

            const success=document.getElementById("successMessage");

            success.style.display="block";

            success.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        });

    }
}


/* =========================
   ROUTE LINKS
========================= */

document.addEventListener("click",function(e){

    const link=e.target.closest('a[href^="#"]');

    if(!link) return;

    const href=link.getAttribute("href");

    if(
        href==="#home" ||
        href==="#privacypolicy" ||
        href==="#data-deletion"
    ){

        e.preventDefault();

        window.location.hash=href.substring(1);

        render();

    }

});


window.addEventListener("hashchange",render);

render();

</script>

</body>
</html>
